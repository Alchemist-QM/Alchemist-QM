<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarly Clone - Research Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .query-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .summary-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .summary-card h3 {
            color: #2a5298;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .source-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s ease;
        }

        .source-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .source-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2a5298;
            margin-bottom: 10px;
        }

        .source-url {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .source-summary {
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .insights, .citations {
            margin-top: 15px;
        }

        .insight-item, .citation-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 0 5px 5px 0;
        }

        .metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
            font-size: 0.9em;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Scholarly Clone</h1>
            <p>Advanced Research Assistant with Web Scraping & AI Analysis</p>
        </div>

        <div class="main-content">
            <div class="query-section">
                <div class="input-group">
                    <label for="query">Research Query</label>
                    <textarea id="query" placeholder="Enter your research question (e.g., 'What are the latest developments in quantum computing?')"></textarea>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="queryType">Query Type</label>
                        <select id="queryType">
                            <option value="general">General Research</option>
                            <option value="academic">Academic Papers</option>
                            <option value="news">News Articles</option>
                            <option value="comparative">Comparative Analysis</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="maxResults">Max Results</label>
                        <select id="maxResults">
                            <option value="5">5 Sources</option>
                            <option value="10" selected>10 Sources</option>
                            <option value="15">15 Sources</option>
                            <option value="20">20 Sources</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="language">Language</label>
                        <select id="language">
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>

                <button class="btn" onclick="conductResearch()">🚀 Start Research</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Conducting research... This may take a few moments.</p>
            </div>

            <div class="error" id="error" style="display: none;"></div>

            <div class="results" id="results">
                <div class="tabs">
                    <div class="tab active" onclick="showTab('overview')">Overview</div>
                    <div class="tab" onclick="showTab('sources')">Sources</div>
                    <div class="tab" onclick="showTab('insights')">Key Insights</div>
                    <div class="tab" onclick="showTab('citations')">Citations</div>
                </div>

                <div class="tab-content active" id="overview">
                    <div class="summary-card">
                        <h3>📊 Research Summary</h3>
                        <div id="overallSummary"></div>
                        
                        <div class="metadata" id="metadata">
                            <!-- Metadata will be populated here -->
                        </div>
                    </div>

                    <div class="summary-card">
                        <h3>🔑 Key Findings</h3>
                        <div id="keyFindings"></div>
                    </div>

                    <div class="summary-card">
                        <h3>🔗 Related Topics</h3>
                        <div id="relatedTopics"></div>
                    </div>
                </div>

                <div class="tab-content" id="sources">
                    <div id="sourcesList"></div>
                </div>

                <div class="tab-content" id="insights">
                    <div id="allInsights"></div>
                </div>

                <div class="tab-content" id="citations">
                    <div id="allCitations"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        function showTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(tabName).classList.add('active');

            // Add active class to clicked tab
            event.target.classList.add('active');
        }

        async function conductResearch() {
            const query = document.getElementById('query').value.trim();
            
            if (!query) {
                showError('Please enter a research query.');
                return;
            }

            const queryType = document.getElementById('queryType').value;
            const maxResults = parseInt(document.getElementById('maxResults').value);
            const language = document.getElementById('language').value;

            // Show loading state
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.querySelector('.btn').disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/research`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        query_type: queryType,
                        max_results: maxResults,
                        language: language
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Research request failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Research failed:', error);
                showError(`Research failed: ${error.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.btn').disabled = false;
            }
        }

        function displayResults(data) {
            // Overall summary
            document.getElementById('overallSummary').innerHTML = `<p>${data.overall_summary}</p>`;

            // Metadata
            const metadata = document.getElementById('metadata');
            metadata.innerHTML = `
                <div><strong>Sources Found:</strong> ${data.total_sources_found}</div>
                <div><strong>Sources Processed:</strong> ${data.sources_processed}</div>
                <div><strong>Processing Time:</strong> ${data.processing_time.toFixed(2)}s</div>
                <div><strong>Confidence Score:</strong> ${(data.confidence_score * 100).toFixed(1)}%</div>
                <div><strong>Query Type:</strong> ${data.query_type}</div>
            `;

            // Key findings
            const keyFindings = document.getElementById('keyFindings');
            if (data.key_findings && data.key_findings.length > 0) {
                keyFindings.innerHTML = data.key_findings.map(finding => 
                    `<div class="insight-item">• ${finding}</div>`
                ).join('');
            } else {
                keyFindings.innerHTML = '<p>No key findings extracted.</p>';
            }

            // Related topics
            const relatedTopics = document.getElementById('relatedTopics');
            if (data.related_topics && data.related_topics.length > 0) {
                relatedTopics.innerHTML = data.related_topics.map(topic => 
                    `<span style="display: inline-block; background: #e9ecef; padding: 5px 10px; margin: 3px; border-radius: 15px; font-size: 0.9em;">${topic}</span>`
                ).join('');
            } else {
                relatedTopics.innerHTML = '<p>No related topics found.</p>';
            }

            // Sources
            const sourcesList = document.getElementById('sourcesList');
            if (data.sources && data.sources.length > 0) {
                sourcesList.innerHTML = data.sources.map(source => `
                    <div class="source-card">
                        <div class="source-title">${source.title}</div>
                        <div class="source-url">
                            <a href="${source.url}" target="_blank" style="color: #667eea; text-decoration: none;">
                                ${source.url}
                            </a>
                        </div>
                        <div class="source-summary">${source.summary}</div>
                        
                        <div class="metadata">
                            <div><strong>Type:</strong> ${source.source_type}</div>
                            <div><strong>Processing Time:</strong> ${source.processing_time.toFixed(2)}s</div>
                            <div><strong>Citations:</strong> ${source.citations.length}</div>
                            <div><strong>Insights:</strong> ${source.insights.length}</div>
                        </div>
                    </div>
                `).join('');
            } else {
                sourcesList.innerHTML = '<p>No sources were successfully processed.</p>';
            }

            // All insights
            const allInsights = document.getElementById('allInsights');
            const insights = data.sources.flatMap(source => source.insights);
            if (insights.length > 0) {
                allInsights.innerHTML = insights.map(insight => `
                    <div class="insight-item">
                        <strong>${insight.insight}</strong>
                        <div style="margin-top: 5px; font-size: 0.9em; color: #666;">
                            Relevance: ${(insight.relevance_score * 100).toFixed(1)}% | 
                            Category: ${insight.category || 'General'}
                        </div>
                        ${insight.supporting_evidence && insight.supporting_evidence.length > 0 ? 
                            `<div style="margin-top: 8px; font-size: 0.9em; font-style: italic;">
                                Evidence: ${insight.supporting_evidence.join('; ')}
                            </div>` : ''
                        }
                    </div>
                `).join('');
            } else {
                allInsights.innerHTML = '<p>No insights were extracted from the sources.</p>';
            }

            // All citations
            const allCitations = document.getElementById('allCitations');
            const citations = data.sources.flatMap(source => source.citations);
            if (citations.length > 0) {
                allCitations.innerHTML = citations.map(citation => `
                    <div class="citation-item">
                        <strong>"${citation.text}"</strong>
                        <div style="margin-top: 5px; font-size: 0.9em; color: #666;">
                            Context: ${citation.context}
                        </div>
                        <div style="margin-top: 3px; font-size: 0.8em; color: #888;">
                            Type: ${citation.citation_type || 'Unknown'} | 
                            Confidence: ${(citation.confidence * 100).toFixed(1)}%
                        </div>
                    </div>
                `).join('');
            } else {
                allCitations.innerHTML = '<p>No citations were found in the sources.</p>';
            }

            // Show results
            document.getElementById('results').style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Add Enter key support for the query textarea
        document.getElementById('query').addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'Enter') {
                conductResearch();
            }
        });
    </script>
</body>
</html>
